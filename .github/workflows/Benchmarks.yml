name: Benchmark

on:
  pull_request:
    branches: [dirac]
    paths-ignore: ['docs/**', '*.md']

permissions:
  pull-requests: write
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["lts", "1.12.0-rc1"]
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia_version: ${{ matrix.version }}
          script: "benchmark/benchmarks.jl"
          annotate_pr: true

[ensemble]
mode = "build"
numinstances = 8
L = [28, 28, 28, 8]
numtherm = 15
numsteps = 2000
numprocs_cart = [1, 1, 1, 1]
halo_width = 1
initial = "cold"
update_method = "hmc"
su3_nfloats = 12

[gauge_action]
beta = 4.1479
gauge_action = "symanzik_tree"

[fermion_action]

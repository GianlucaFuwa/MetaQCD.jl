[[fermion_action.fermions]]
precon = "none"
Nf = 1
mass = 0.019370
cg_tol_action = 1e-10
cg_tol_md = 1e-5
cg_maxiters_action = 5000
cg_maxiters_md = 5000
rhmc_order_action = 11

[[fermion_action.fermions]]
precon = "heavy"
Nf = 2
mass = [0.00070104958378574, 0.019370]
cg_tol_action = 1e-10
cg_tol_md = 1e-5
cg_maxiters_action = 5000
cg_maxiters_md = 5000
rhmc_order_action = 11
rhmc_order_md = 8
rhmc_tol_action = 1e-5
rhmc_tol_md = 1e-4
rhmc_spectral_bound = [0.00025, 6.0]
[[fermion_action.fermions]]
precon = "none"
Nf = 1
mass = 0.019370
cg_tol_action = 1e-10
cg_tol_md = 1e-5

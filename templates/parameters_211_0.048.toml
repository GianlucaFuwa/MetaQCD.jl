[data]
float_type = "double"
solver_float_type = "double"
backend = "rocm"
ensemble_dir = "/zhome/academic/HLRS/xnw/xnwgfuwa/projects/MetaQCD.jl/ensembles/nf211_a0.048_build_8smear_2"
randomseed = 0
overwrite = true
verboselevel = 2

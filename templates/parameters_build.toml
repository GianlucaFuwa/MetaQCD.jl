[data]
float_type = "double"
backend = "rocm"
ensemble_dir = "/home/gialu/data/MetaQCD/test_build"
randomseed = 123
overwrite = true
verboselevel = 1
log_to_console = true

[ensemble]
L = [4, 4, 4, 4]
numtherm = 20
numsteps = 10
numprocs_cart = [1, 1, 1, 2]
halo_width = 1
initial = "cold"
update_method = "hmc"
numinstances = 2

[gauge_action]
beta = 6.0
gauge_action = "wilson"

[bias]
rhostout_for_cv = 0.12 # rho is the same for all CVs
starting_Q = [1, 0]
[[bias.biases]]
type = "metad"
kind_of_cv = "topcharge_clover"
numsmears_for_cv = 4
static = false
symmetric = true
stride = 1
cvlims = [-2.0, 2.0]
biasfactor = inf
penalty_weight = 100.0
# opes specific parameters
barrier = 10.0
sigma_0 = 0.0
# metad specific parameters
bin_width = 0.01
meta_weight = 0.1
[[bias.biases]]
type = "opesmt"
beta_min_max = [5.2, 5.7]
beta_num = 100
numsmears_for_cv = 0
static = false
stride = 1

[hmc]
hmc_trajectory = 1
[[hmc.levels]]
forces = [0, 1]
integrator = "OMF4"
numsteps = 5

[gradient_flow]
flow_integrator = "euler"
flow_num = 30
flow_steps = 1
flow_tf = 0.12 # total flow time is flow_num * flow_tf
flow_measure_every = [1, 2, 5, 10, 20, 30]

[measurements.Plaquette]
measure_every = 1

[measurements.Topological_charge]
measure_every = 1
type = ["plaquette", "clover"]

[measurements_with_flow.Plaquette]
measure_every = 1

[measurements_with_flow.Topological_charge]
measure_every = 1
type = ["plaquette", "clover"]

[ensemble] # Headers are not necessary
L = [4, 4, 4, 4]
numtherm = 20
numsteps = 10
initial = "cold"
update_method = "hmc"
parity_update = false
backend = "cpu"
float_type = "double"
# numprocs_cart = [1, 1, 1, 1]
# halo_width = 1

[data]
ensemble_dir = "/data/MetaQCD/test_fermions"
randomseed = 0
overwrite = true
# save_checkpoint_every = 10
# save_config_format = "bridge"
# save_config_every = 10
verboselevel = 1
log_to_console = true
# load_checkpoint_fromfile = true
# load_checkpoint_path = ""

[gauge_action]
beta = 0.95
gauge_action = "dbw2"

# TODO: Try staggered preconditioning ala hep-lat/0610047 via this twisted mass formalism and RationalFunctionApproximation
[fermion_action]
fermion_action = "staggered"
wilson_csw = 1.0
num_fermions = 2
# twisted_mass = [0.01, 1.0]
[[fermion_action.fermions]]
precon = "heavy" # FIXME:
Nf = 2
mass = [0.05, 0.005] # numerator mass and denominator mass
cg_tol_action = 1e-19
cg_tol_md = 1e-8
cg_maxiters_action = 5000
cg_maxiters_md = 1000
rhmc_order_action = 15
rhmc_order_md = 10
rhmc_spectral_bound = [0.000025, 6.0]
[[fermion_action.fermions]]
precon = "none" # FIXME:
Nf = 3
mass = 0.05 # only denominator mass
hasenbush = true
num_pseudoferm = 2
cg_tol_action = 1e-19
cg_tol_md = 1e-10
cg_maxiters_action = 5000
cg_maxiters_md = 1000
rhmc_order_action = 15
rhmc_order_md = 10
rhmc_spectral_bound = [0.0025, 6.0]

[hmc]
hmc_trajectory = 1
# hmc_numsmear_fermion = 4
# hmc_rhostout_fermion = 0.125

# [[hmc.levels]] # Gauge action - finest
# forces = [1, 2, 3] # 0: bias, 1: gauge_action, k>1: fermion
# integrator = "OMF4"
# numsteps = 5
[[hmc.levels]] # Gauge action - finest
forces = [1, 3] # force 1: gauge action
integrator = "OMF4"
numsteps = 2
[[hmc.levels]] # PF action - largest masses
forces = [2]
integrator = "OMF4"
numsteps = 5

[gradient_flow]
flow_integrator = "euler"
flow_num = 7
flow_steps = 1
flow_tf = 0.12 # total flow time is flow_num * flow_tf
flow_measure_every = 7

[measurements.Plaquette]
measure_every = 10

[measurements.Topological_charge]
measure_every = 10
kinds_of_topological_charge = ["plaquette", "clover"]

[measurements_with_flow.Plaquette]
measure_every = 10

[measurements_with_flow.Topological_charge]
measure_every = 10
kinds_of_topological_charge = ["plaquette", "clover"]
